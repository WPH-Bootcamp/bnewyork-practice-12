<!-- Vanilla DOM halaman 2 - kode untuk render card hampir duplikat dari halaman 1 -->
<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Vanilla DOM — Halaman 2 (Karyawan)</title>
    <style>
      body {
        font-family: sans-serif;
        background: #0f172a;
        color: #fff;
        padding: 40px;
      }
      .card {
        padding: 16px;
        background: #1e293b;
        border-radius: 8px;
        margin: 8px 0;
      }
      h3 {
        color: #60a5fa;
      }
    </style>
  </head>
  <body>
    <h1>👔 Daftar Karyawan — Vanilla DOM (Halaman 2)</h1>
    <p>Perhatikan: kode rendering card-nya hampir sama persis dengan halaman 1.</p>

    <div id="root"></div>

    <script>
      const employees = [
        { name: "Budi Santoso", role: "Frontend Dev" },
        { name: "Siti Aminah", role: "Backend Dev" },
        { name: "Andi Pratama", role: "Designer" },
      ];

      // Kode rendering HAMPIR IDENTIK dengan halaman 1.
      // Yang berbeda hanya data & label. Struktur, styling, serta logic-nya sama persis.
      // Pada vanilla, "card" harus ditulis ulang pada setiap halaman yang memerlukan card.
      // Pada React, cukup membuat <Card /> sekali, lalu di-import di mana pun diperlukan.
      const root = document.getElementById("root");

      employees.forEach(function (employee) {
        const card = document.createElement("div");
        card.className = "card";

        const title = document.createElement("h3");
        title.textContent = employee.name;

        const role = document.createElement("p");
        role.textContent = "Posisi: " + employee.role;

        card.appendChild(title);
        card.appendChild(role);
        root.appendChild(card);
      });
    </script>
  </body>
</html>
